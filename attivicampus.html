<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attività Campus</title>
    <link rel="stylesheet" href="campus_hub.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div>
                <h1>Attività del Campus</h1>
                <p class="subtitle">Calendario settimanale</p>
            </div>
            <div class="header-datetime">
                <div id="todayDate">--/--/----</div>
                <div id="digitalClock">--:--:--</div>
            </div>
        </header>

        <!-- Le card verranno generate qui via JavaScript -->
        <div class="day-container" id="dayContainer">
            <p style="color:var(--text-2);font-family:var(--font-mono);">Caricamento attività...</p>
        </div>

        <!-- QR a sinistra, info al centro, link a destra -->
        <div class="qr-container">
            <div class="qr-code">
                <img id="qrImage" alt="QR Code">
            </div>

            <div class="qr-text">
                <h3>Iscriviti subito!</h3>
                <p>Scansiona il QR code con il tuo smartphone o clicca sul tasto</p>
                <p id="qrFallback" style="display:none; margin-top:10px;">
                    <small>Oppure apri questo link: <a id="qrLink" href="#"></a></small>
                </p>
                <p><small>Riservato agli iscritti nella mailing list</small></p>
            </div>

            <div class="qr-action">
                <a id="qrButton" class="btn" href="#" target="_blank" rel="noopener">
                    Apri modulo di iscrizione
                </a>
            </div>
        </div>
    </div>

    <style>
    .qr-container {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 24px;
        box-shadow: var(--shadow-sm);
        margin-top: 24px;
    }

    /* QR a sinistra */
    .qr-code {
        flex: 0 0 auto;
    }
    .qr-code img {
        display: block;
        width: 160px;
        height: 160px;
        border-radius: var(--radius);
        border: 1px solid var(--border-2);
        padding: 6px;
        background: white;
    }

    /* Info al centro */
    .qr-text {
        flex: 1 1 200px;
        min-width: 0;
        text-align: center;
    }
    .qr-text h3 {
        margin-top: 0;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--accent);
        margin-bottom: 8px;
    }
    .qr-text p {
        font-size: 0.82rem;
        color: var(--text-2);
        margin-bottom: 8px;
    }

    /* Link a destra */
    .qr-action {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
    }
    .qr-action .btn {
        display: inline-block;
        width: auto;
        padding: 12px 22px;
        text-align: center;
        white-space: nowrap;
    }

    /* Mobile: torna in colonna */
    @media (max-width: 700px) {
        .qr-container {
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .qr-text { text-align: center; }
        .qr-action { width: 100%; justify-content: center; }
        .qr-action .btn { width: 100%; }
    }
    </style>

    <script src="attiv-script.js"></script>

    <script>
        (function () {
            const subscribeUrl = new URL('subscribe.html', window.location.href).href;
            const img = document.getElementById('qrImage');
            const fallback = document.getElementById('qrFallback');
            const link = document.getElementById('qrLink');
            const button = document.getElementById('qrButton');

            link.href = subscribeUrl;
            link.textContent = subscribeUrl;
            button.href = subscribeUrl;

            img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=' +
                      encodeURIComponent(subscribeUrl);
            img.addEventListener('error', () => {
                img.style.display = 'none';
                fallback.style.display = 'block';
            });
        })();
    </script>
</body>
</html>
