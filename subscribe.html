<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iscrizione Attività</title>
    <link rel="stylesheet" href="attiv.css">
<!-- ===== FAVICON ===== -->
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="favicon.ico" sizes="any" type="image/x-icon">
<link rel="apple-touch-icon" href="icon-192.png">
    <script>
  // ── Pulizia: deregistra eventuali service worker precedenti ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(registrations => {
      registrations.forEach(reg => {
        reg.unregister();
        console.log('🗑️ Service worker deregistrato:', reg.scope);
      });
    });
    // Svuota anche le cache lasciate dal vecchio SW
    if ('caches' in window) {
      caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
    }
  }
</script>
</head>
<body>
    <div class="form-container">
        <h1>Conferma la tua partecipazione</h1>
        <div id="message" class="message"></div>
        <form id="subscriptionForm">
            <div class="form-group">
                <label for="email">Email*</label>
                <input type="email" id="email" required placeholder="la_tua@email.com"
                       aria-describedby="emailRestricted">
                <p class="restricted" id="emailRestricted">Devi essere nella mailing list del Campus.</p>
            </div>

            <div class="form-group">
                <label for="activity">Attività*</label>
                <select id="activity" required disabled>
                    <option value="">Caricamento...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="participation">Partecipazione*</label>
                <select id="participation" required>
                    <option value="">Seleziona...</option>
                    <option value="yes">SÌ, parteciperò</option>
                    <option value="no">NO, non parteciperò</option>
                </select>
            </div>

            <button type="submit">INVIA</button>
        </form>
    </div>

    <script src="attiv.js"></script>
</body>
</html>
