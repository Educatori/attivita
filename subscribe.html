<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iscrizione Attività</title>
    <link rel="stylesheet" href="../assets/campus-theme.css">
    <link rel="stylesheet" href="../assets/campus-activities.css">
</head>
<body>
    <div class="form-container">
        <h1>Iscrizione Attività</h1>
        <div id="message" class="message"></div>
        <form id="subscriptionForm">
            <div class="form-group">
                <label for="email">Email*</label>
                <input type="email" id="email" required placeholder="la_tua@email.com">
                <p class="restricted">Devi essere nella mailing list del Campus.</p>
            </div>

            <div class="form-group">
                <label for="activity">Attività*</label>
                <select id="activity" required>
    <option value="">Caricamento...</option>
</select>
            </div>

            <div class="form-group">
                <label for="participation">Partecipazione*</label>
                <select id="participation" required>
                    <option value="">Conferma...</option>
                    <option value="yes">SÌ, parteciperò</option>
                    <option value="no">NO, non parteciperò</option>
                </select>
            </div>

            <button type="submit">INVIA</button>
        </form>
    </div>

    <script src="../assets/attiv-script.js"></script>
</body>
</html>
